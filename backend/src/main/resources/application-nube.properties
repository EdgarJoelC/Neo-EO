spring.application.name=backend

# ===========================================================================
#  PERFIL DE NUBE - PostgreSQL (Neon)
#  Se activa con la variable de entorno  SPRING_PROFILES_ACTIVE=nube
#
#  Ninguna credencial se escribe aqui: todas llegan como variables de
#  entorno definidas en el panel de Render.
# ===========================================================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Hibernate crea y actualiza el esquema a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# La consola H2 no existe en la nube: la base es PostgreSQL.
spring.h2.console.enabled=false

# El plan gratuito de Neon cierra las conexiones ociosas; el pool se
# dimensiona pequeno y recicla para no arrastrar conexiones muertas.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# === seguridad ===
neobank.jwt.secret=${NEOBANK_JWT_SECRET}
neobank.jwt.expiration=${NEOBANK_JWT_EXPIRATION:86400000}

# === origenes autorizados (CORS): la URL del frontend en Vercel ===
neobank.cors.origins=${NEOBANK_CORS}

# === estado del servicio (Render consulta /actuator/health) ===
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# === crypto module ===
crypto.quoteFiat=USD
crypto.priceTtlSeconds=30
crypto.exchange.provider=paper
