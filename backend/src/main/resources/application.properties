spring.application.name=backend

# ===========================================================================
#  PERFIL LOCAL (por omision) - H2 en archivo
#  El perfil de nube vive en application-nube.properties y se activa con
#  la variable de entorno SPRING_PROFILES_ACTIVE=nube
# ===========================================================================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.datasource.url=jdbc:h2:file:./data/testdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === seguridad ===
# En local usa el valor por omision; en la nube llega por variable de entorno.
neobank.jwt.secret=${NEOBANK_JWT_SECRET:my-very-secret-key-that-is-at-least-256-bits-long!!!}
neobank.jwt.expiration=${NEOBANK_JWT_EXPIRATION:86400000}

# === origenes autorizados (CORS) ===
neobank.cors.origins=${NEOBANK_CORS:http://localhost:3000,http://localhost:3001}

# === estado del servicio ===
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# === crypto module ===
crypto.quoteFiat=USD
crypto.priceTtlSeconds=30
crypto.exchange.provider=paper
